name: RAPT Therapeutics
description: 'RAPT Therapeutics is a clinical-stage biopharmaceutical company developing
  oral small-molecule and antibody therapies for patients with inflammatory, immunologic,
  and oncologic diseases. Its pipeline centers on ozureprubart, a long-acting anti-IgE
  antibody candidate in Phase 2 trials for food allergies, alongside programs targeting
  key drivers of immune response. The company was acquired by GSK in January 2026.
  It was surfaced as a portfolio company of GV and added to the API Evangelist network;
  as a life-sciences therapeutics company it publishes no public API, developer portal,
  or machine-readable API surface.'
